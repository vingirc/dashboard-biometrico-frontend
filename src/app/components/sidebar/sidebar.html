<aside class="h-screen w-64 bg-gray-800 border-r border-gray-700 flex flex-col p-4 text-white">
  <div class="flex items-center gap-2 mb-10 text-blue-400">
    <svg
      class="w-8 h-8 shrink-0"
      viewBox="0 0 32 32"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M2 16H9L12 9L16 23L19.5 13L22 16H30" />
    </svg>
    <span class="text-2xl font-bold">BIOMETRICS</span>
  </div>


  <nav class="flex flex-col gap-4">
    <a routerLink="/dashboard" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg transition-colors">
      <i class="pi pi-chart-line"></i> Dashboard
    </a>
    <a routerLink="/historial" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg transition-colors">
      <i class="pi pi-list"></i> Historial
    </a>
    @if ((currentUser$ | async)?.role === 'ADMIN') {
      <a routerLink="/usuarios" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg transition-colors">
        <i class="pi pi-users"></i> Gestion de Usuarios
      </a>
      <a routerLink="/auditoria" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg transition-colors">
        <i class="pi pi-shield"></i> Auditoría
      </a>
    }
  </nav>

  <div class="mt-auto flex flex-col gap-2 pt-4 border-t border-gray-700">
    @if (currentUser$ | async; as user) {
      <div class="px-3 text-xs text-gray-400">
        <p class="text-gray-200">{{ user.username }}</p>
        <p>{{ user.role }}</p>
      </div>
    }
    <button
      type="button"
      (click)="logout()"
      class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg transition-colors text-left text-red-400"
    >
      <i class="pi pi-sign-out"></i> Cerrar sesion
    </button>
  </div>
</aside>
