name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Ejecutar tests
        run: npm test -- --watch=false

      - name: Build de produccion
        run: npm run build
