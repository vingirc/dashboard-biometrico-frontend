resolver 1.1.1.1 valid=30s;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El hostname del backend se resuelve en cada request (resolver + variable) en vez de quedar
  # cacheado como IP al arrancar el contenedor, que es lo que hace nginx si se pone el host
  # literal en proxy_pass.
  location /api/ {
    set $backend "https://dashboard-biometrico-backend.onrender.com";
    proxy_pass $backend$request_uri;
    proxy_ssl_server_name on;
    proxy_set_header Host dashboard-biometrico-backend.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
